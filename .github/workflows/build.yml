name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Injetar permissoes
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest># <uses-permission android:name="android.permission.CAMERA" />\n <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n <uses-permission android:name="android.permission.INTERNET" />\n</manifest>#' $M
          cat $M

      - name: Sincronizar
        run: npx cap sync android

      - name: Aplicar icone e splash
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#1E7B4A' \
            --iconBackgroundColorDark '#1E7B4A' \
            --splashBackgroundColor '#0E5F3C' \
            --splashBackgroundColorDark '#04120C'

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PenaltyKings-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
